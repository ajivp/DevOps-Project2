apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project2
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1  
  selector:
    matchLabels:
      app: devops-project2
  template:
    metadata:
      labels:
        app: devops-project2
    spec:
      containers:
        - name: devops-project2
          image: avp18/devops-project2:2.0
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
